<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Apply the saved language before first paint (the toggle in the header reloads the page).
      try {
        var q = new URLSearchParams(location.search).get("lang");
        if (q === "ar" || q === "en") localStorage.setItem("tp-lang", q);
        if (localStorage.getItem("tp-lang") === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; }
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TeddyPups U.A.E. — Premium teacup puppies in Dubai</title>
    <meta name="description" content="Teddy bear and teacup puppies in Dubai. Meet local puppies in our Downtown Dubai showroom or bring home a rare breed imported from trusted breeders." />
    <meta property="og:title" content="TeddyPups U.A.E. — Premium teacup puppies in Dubai" />
    <meta property="og:description" content="Teddy bear and teacup puppies in Dubai. Meet local puppies in our Downtown Dubai showroom or bring home a rare breed imported from trusted breeders." />
    <meta property="og:image" content="/brand/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fffdf8" />
    <link rel="icon" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
